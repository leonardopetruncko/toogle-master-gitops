apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flag-service
  namespace: argocd
spec:
  project: toogle-master
  source:
    repoURL: 'https://github.com/drop0rz/toogle-master-gitops.git'
    targetRevision: main
    path: apps/flag-service
  destination:
    server: https://kubernetes.default.svc
    namespace: toogle-master
  # O self-healer faz "rollout restart" (annotation restartedAt no template do pod).
  # Sem isto, o selfHeal do ArgoCD desfaria o restart e causaria um segundo rollout.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"
  syncPolicy:
    # Pull-based: o ArgoCD é quem consulta o repo Git (polling ~3min, ou via
    # webhook) e sincroniza; nada externo faz "push" no cluster.
    automated:
      prune: true      # remove recursos que saíram do Git
      selfHeal: true    # desfaz mudanças manuais feitas via kubectl direto
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
