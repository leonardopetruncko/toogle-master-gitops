# Loki: centralização e indexação dos logs de todos os contêineres do cluster.
# Multi-source: o chart vem do repositório Helm oficial e o values vem deste repo Git
# (ref "values"), então toda a configuração fica versionada aqui.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/observability/values/loki.yaml
    - repoURL: 'https://github.com/drop0rz/toogle-master-gitops.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
