# Configuração da observabilidade como código: dashboard, regras de alerta, contact points
# e o self-healer (Runbook Automation). Diretório Kustomize em observability/manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: 'https://github.com/drop0rz/toogle-master-gitops.git'
    targetRevision: main
    path: observability/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
