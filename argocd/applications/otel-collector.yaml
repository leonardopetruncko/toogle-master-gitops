# OpenTelemetry Collector: recebe, processa e roteia métricas, logs e traces.
# Multi-source: o chart vem do repositório Helm oficial e o values vem deste repo Git
# (ref "values"), então toda a configuração fica versionada aqui.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
      chart: opentelemetry-collector
      targetRevision: 0.173.1
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/observability/values/otel-collector.yaml
    - repoURL: 'https://github.com/leonardopetruncko/toogle-master-gitops.git'
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
