# Loki em modo SingleBinary: 1 pod, storage em filesystem (emptyDir).
# O AWS Academy não tem o driver EBS CSI, então não há volume persistente:
# os logs vivem enquanto o cluster existir (suficiente para a demo e a gravação).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Necessário para receber logs via OTLP (endpoint /otlp) vindos do OTel Collector.
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  extraVolumes:
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Modos distribuídos desligados (só o SingleBinary roda).
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Caches memcached e componentes extras pedem muita memória: desligados para caber no cluster.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
